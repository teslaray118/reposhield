name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run built-in test suite
      run: python reposhield.py test

    - name: Run unittest discovery
      run: python -m unittest discover -s tests -p "test_*.py"

    - name: Verify CLI scan and check commands
      run: |
        python reposhield.py scan .
        python reposhield.py check .

    - name: Test package installation and CLI entrypoint
      run: |
        python -m pip install --upgrade pip
        pip install .
        reposhield --version
        reposhield test
